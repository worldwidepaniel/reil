<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Golden honey gradient for the outer honeycomb -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  
  <!-- Outer Hexagon (Honeycomb) -->
  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="url(#hexGrad)" stroke="#B45309" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Inner Hexagon -->
  <polygon points="50,15 80,32.5 80,67.5 50,85 20,67.5 20,32.5" fill="#F59E0B"/>
  
  <!-- Left Wing -->
  <ellipse cx="32" cy="40" rx="14" ry="7" fill="#FFFFFF" opacity="0.9" transform="rotate(-35 32 40)"/>
  
  <!-- Right Wing -->
  <ellipse cx="68" cy="40" rx="14" ry="7" fill="#FFFFFF" opacity="0.9" transform="rotate(35 68 40)"/>
  
  <!-- Bee Body -->
  <rect x="42" y="36" width="16" height="28" rx="8" fill="#451A03"/>
  
  <!-- Yellow Stripes -->
  <rect x="42" y="44" width="16" height="4" fill="#FBBF24"/>
  <rect x="42" y="54" width="16" height="4" fill="#FBBF24"/>
  
  <!-- Stinger -->
  <polygon points="47,63 53,63 50,72" fill="#451A03" stroke-linejoin="round"/>
  
  <!-- Head -->
  <circle cx="50" cy="30" r="6" fill="#451A03"/>
  
  <!-- Antennae -->
  <path d="M 47,26 C 44,20 40,22 40,22" fill="none" stroke="#451A03" stroke-width="2" stroke-linecap="round"/>
  <path d="M 53,26 C 56,20 60,22 60,22" fill="none" stroke="#451A03" stroke-width="2" stroke-linecap="round"/>
</svg>
